<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番倍效率鐘</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --primary-color: #ff6b6b;
            --primary-dark: #ee5253;
            --secondary-color: #1dd1a1;
            --text-dark: #2d3436;
            --text-gray: #636e72;
            --card-bg: #ffffff;
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --input-border: #dfe6e9;
            --list-bg: #f8f9fa;
        }

        body.dark-mode {
            --bg-color: #1a1a2e;
            --primary-color: #e94560;
            --primary-dark: #c0392b;
            --secondary-color: #0fb9b1;
            --text-dark: #f1f2f6;
            --text-gray: #a4b0be;
            --card-bg: #16213e;
            --shadow: 0 8px 30px rgba(0,0,0,0.4);
            --input-border: #2f3640;
            --list-bg: #0f3460;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            transition: background-color 0.3s;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-dark);
        }

        .active-task-banner {
            background: var(--primary-color);
            color: white;
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tomato-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .tomato {
            width: 180px;
            height: 160px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-radius: 50% 50% 45% 45% / 55% 55% 45% 45%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.15), 0 15px 25px rgba(238, 82, 83, 0.3);
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .tomato::before {
            content: '';
            position: absolute;
            top: -12px;
            width: 40px;
            height: 25px;
            background: #10ac84;
            border-radius: 50px 50px 0 0;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.2);
        }

        .timer-text {
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            z-index: 10;
            font-variant-numeric: tabular-nums;
        }

        .controls { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
        .chart-container { height: 150px; width: 100%; margin-bottom: 20px; }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            background-color: var(--list-bg);
            color: var(--text-dark);
        }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .todo-section { border-top: 2px dashed var(--input-border); padding-top: 20px; }
        .input-row, .meta-row { display: flex; gap: 8px; margin-bottom: 10px; }
        
        .task-input, select, input[type="datetime-local"] {
            flex: 1; padding: 10px; border: 1px solid var(--input-border);
            border-radius: 8px; font-size: 0.9rem; background: var(--card-bg); color: var(--text-dark);
        }

        ul { list-style: none; padding: 0; max-height: 300px; overflow-y: auto; }
        li {
            background: var(--list-bg); border-radius: 12px; padding: 12px;
            margin-bottom: 10px; display: flex; flex-direction: column;
            border-left: 4px solid var(--secondary-color); transition: 0.3s;
        }
        li.completed { opacity: 0.5; border-left-color: var(--text-gray); }
        li.completed .task-title { text-decoration: line-through; }

        .task-header { display: flex; justify-content: space-between; align-items: center; }
        .task-title { font-weight: bold; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .task-info { display: flex; gap: 10px; margin-top: 8px; font-size: 0.8rem; color: var(--text-gray); align-items: center; }

        .badge { padding: 3px 8px; border-radius: 20px; font-weight: bold; }
        .badge-tomato { background: rgba(255,107,107,0.2); color: var(--primary-color); }
        .badge-overdue { background: var(--primary-color); color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        .action-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; }
        .play-btn { color: var(--secondary-color); }
        .del-btn { color: var(--primary-color); }
    </style>
</head>
<body>

<div class="app-container">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon">☀️</button>
    
    <div class="tomato-container">
        <div class="active-task-banner" id="activeTaskBanner">目前專注：無綁定任務</div>
        <div class="tomato">
            <div class="timer-text" id="timeDisplay">25:00</div>
        </div>
        
        <div style="margin-top: 15px; width: 100%; text-align: center;">
            <input type="range" id="timeSlider" min="1" max="60" value="25" oninput="updateSlider()" style="width:70%">
            <span style="color:var(--text-gray); font-size:0.9rem"><span id="sliderValue">25</span> 分鐘</span>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="startTimer()">開始專注</button>
            <button class="btn" onclick="pauseTimer()">暫停</button>
            <button class="btn" onclick="resetTimer()">重置</button>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="pomodoroChart"></canvas>
    </div>

    <div class="todo-section">
        <div class="input-row">
            <input type="text" id="taskInput" class="task-input" placeholder="想完成什麼任務？">
            <button class="btn btn-primary" onclick="addTask()">新增</button>
        </div>
        <div class="meta-row">
            <select id="categoryInput">
                <option value="💼 工作">💼 工作</option>
                <option value="📚 學習">📚 學習</option>
                <option value="🏠 生活">🏠 生活</option>
            </select>
            <input type="datetime-local" id="deadlineInput">
        </div>
        <ul id="taskList"></ul>
    </div>
</div>

<script>
    let isDarkMode = localStorage.getItem('tomatoTheme') === 'dark';
    if(isDarkMode) document.body.classList.add('dark-mode');
    document.getElementById('themeIcon').textContent = isDarkMode ? '🌙' : '☀️';

    function toggleTheme() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-mode', isDarkMode);
        document.getElementById('themeIcon').textContent = isDarkMode ? '🌙' : '☀️';
        localStorage.setItem('tomatoTheme', isDarkMode ? 'dark' : 'light');
        updateChart(); 
    }

    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    let audioCtx = null;

    function playBeep() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 音高
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
            osc.stop(audioCtx.currentTime + 0.5);
        } catch(e) { console.log("音效播放失敗", e); }
    }

    let tasks = JSON.parse(localStorage.getItem('tomatoTasks')) || [];
    let stats = JSON.parse(localStorage.getItem('tomatoStats')) || {};
    let activeTaskId = null;

    function saveTasks() { localStorage.setItem('tomatoTasks', JSON.stringify(tasks)); }
    function saveStats() { localStorage.setItem('tomatoStats', JSON.stringify(stats)); }

    function getTodayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
    }

    function recordPomodoro() {
        const today = getTodayStr();
        stats[today] = (stats[today] || 0) + 1;
        saveStats();
        
        if(activeTaskId) {
            const task = tasks.find(t => t.id === activeTaskId);
            if(task) {
                task.pomodoros = (task.pomodoros || 0) + 1;
                saveTasks();
                renderTasks();
            }
        }
        updateChart();
    }

    function addTask() {
        const name = document.getElementById('taskInput').value.trim();
        if (!name) return alert("請輸入任務名稱！");
        
        tasks.push({
            id: Date.now(), name: name,
            category: document.getElementById('categoryInput').value,
            deadline: document.getElementById('deadlineInput').value,
            completed: false, pomodoros: 0
        });
        saveTasks(); renderTasks();
        document.getElementById('taskInput').value = "";
    }

    function toggleTask(id) {
        const task = tasks.find(t => t.id === id);
        if(task) { task.completed = !task.completed; saveTasks(); renderTasks(); }
    }

    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        if(activeTaskId === id) clearActiveTask();
        saveTasks(); renderTasks();
    }

    function bindTaskToTimer(id) {
        activeTaskId = id;
        const task = tasks.find(t => t.id === id);
        const banner = document.getElementById('activeTaskBanner');
        banner.textContent = `🎯 目前專注：${task.name}`;
        banner.style.opacity = 1;
        renderTasks();
    }

    function clearActiveTask() {
        activeTaskId = null;
        const banner = document.getElementById('activeTaskBanner');
        banner.textContent = "目前專注：無綁定任務";
        banner.style.opacity = 0;
    }

    function renderTasks() {
        const list = document.getElementById('taskList');
        list.innerHTML = "";
        const now = new Date().getTime();

        tasks.forEach(task => {
            const isOverdue = task.deadline && !task.completed && (now > new Date(task.deadline).getTime());
            const li = document.createElement('li');
            if (task.completed) li.className = "completed";
            
            li.innerHTML = `
                <div class="task-header">
                    <div class="task-title" onclick="toggleTask(${task.id})">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} style="cursor:pointer;">
                        ${task.name}
                    </div>
                    <div>
                        ${!task.completed ? `<button class="action-btn play-btn" onclick="bindTaskToTimer(${task.id})" title="綁定此任務計時">▶</button>` : ''}
                        <button class="action-btn del-btn" onclick="deleteTask(${task.id})" title="刪除">✖</button>
                    </div>
                </div>
                <div class="task-info">
                    <span class="badge" style="background:#eee;color:#333">${task.category}</span>
                    <span class="badge badge-tomato">🍅 x ${task.pomodoros || 0}</span>
                    ${task.deadline ? `<span>🕒 ${new Date(task.deadline).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>` : ''}
                    ${isOverdue ? '<span class="badge badge-overdue">⚠️ 已逾期</span>' : ''}
                </div>
            `;
            list.appendChild(li);
        });
    }

    let timeLeft = 25 * 60;
    let timerInterval = null;
    let isRunning = false;

    function updateSlider() {
        if(!isRunning) {
            document.getElementById('sliderValue').textContent = document.getElementById('timeSlider').value;
            timeLeft = document.getElementById('timeSlider').value * 60;
            renderTime();
        }
    }

    function renderTime() {
        let m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        let s = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timeDisplay').textContent = `${m}:${s}`;
    }

    function startTimer() {
        if (!isRunning) {
            isRunning = true;
            document.getElementById('startBtn').textContent = "專注中...";
            document.getElementById('timeSlider').disabled = true;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    renderTime();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    document.getElementById('startBtn').textContent = "開始專注";
                    document.getElementById('timeSlider').disabled = false;
                    
                    playBeep();
                    if (Notification.permission === "granted") {
                        new Notification("🍅 番茄鐘完成！", { body: activeTaskId ? "任務推進了一步，休息一下吧！" : "恭喜完成一次專注！" });
                    }
                    recordPomodoro();
                    clearActiveTask();
                    
                    setTimeout(() => {
                        alert("🍅 恭喜完成！");
                        timeLeft = document.getElementById('timeSlider').value * 60;
                        renderTime();
                    }, 100);
                }
            }, 1000);
        }
    }

    function pauseTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        document.getElementById('startBtn').textContent = "繼續專注";
    }

    function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        document.getElementById('startBtn').textContent = "開始專注";
        document.getElementById('timeSlider').disabled = false;
        timeLeft = document.getElementById('timeSlider').value * 60;
        renderTime();
        clearActiveTask();
    }

    let chartInstance = null;
    function updateChart() {
        const ctx = document.getElementById('pomodoroChart').getContext('2d');
        const labels = [];
        const data = [];
        
        for(let i=6; i>=0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
            labels.push(`${d.getMonth()+1}/${d.getDate()}`);
            data.push(stats[dateStr] || 0);
        }

        const textColor = document.body.classList.contains('dark-mode') ? '#f1f2f6' : '#2d3436';

        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: '完成番茄數 🍅',
                    data: data,
                    backgroundColor: '#ff6b6b',
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, title: { display: true, text: '近七日專注追蹤', color: textColor } },
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1, color: textColor } },
                    x: { ticks: { color: textColor } }
                }
            }
        });
    }

    renderTime();
    renderTasks();
    updateChart();
    setInterval(renderTasks, 60000);
</script>

</body>
</html>
